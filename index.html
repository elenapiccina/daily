<script>
    const tateQuotes = [
        "Focus on making yourself feel excited, powerful. Imagine yourself destroying goals with ease.",
        "Success is not accidental. It is a reward for showing up every single day when everyone else quit.",
        "High absolute discipline beats temporary fleeting motivation every single time. Build your mind.",
        "Cost of regret is far heavier than the price of daily hard work. Get up and execute your plan.",
        "True power is controlling your focus when distractions are begging for your attention.",
        "Close your eyes and realize nobody is coming to save you. You must build your own empire.",
        "Real routine momentum gathers when you stop negotiating with your own lazy thoughts."
      * "The number one thing that tells me if a man's going to be successful is his stress tolerance. You are not going to have a big life without big problems." 
* "Men should adopt the mindset that absolutely everything that happens to them is completely and utterly their fault, whether it's good or bad." 
* "90% of success is going through stress, pain, torment, and bullst."
* "Emotional control isn't a lack of emotion; it's a necessary function of maturity." 
* "A man without a vision for his future always returns to his past." 
* "⚡Discipline is the key to success. Absolutely is. If you cannot force yourself to do something that you do not want to do, how are you ever gonna put yourself through the suffering required for greatness?"
* "Action always wins over excuses."
* "Today you can act as an amateur or you can be a professional. Decide what you will do right now."
* "Everything you want is on the other side of hard work."


    ];

    // Safe local storage reader that won't crash Notion iframes
    function getStoredData() {
        try {
            const data = localStorage.getItem('notion_glass_control_v1');
            return data ? JSON.parse(data) : null;
        } catch (e) {
            console.warn("Storage restricted by browser/iframe:", e);
            return null;
        }
    }

    // Safe local storage writer
    function saveStoredData(data) {
        try {
            localStorage.setItem('notion_glass_control_v1', JSON.stringify(data));
        } catch (e) {
            console.warn("Could not save to localStorage (iframe restriction):", e);
        }
    }

    let controlData = getStoredData() || {
        energyLevel: "💡 Manageable",
        streak: 0,
        lastLoggedDate: ""
    };

    let isConfirmingReset = false;

    function getFormattedToday() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function setLiveWidgetDate() {
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString('en-US', options);
        
        const quoteIndex = today.getDate() % tateQuotes.length;
        document.getElementById('mainMotivationalQuote').innerText = tateQuotes[quoteIndex];
    }

    function runEnergyFormula() {
        const energySelect = document.getElementById('energySelect');
        const guidanceDisplay = document.getElementById('formulaGuidanceDisplay');
        const selectedValue = energySelect.value;

        controlData.energyLevel = selectedValue;
        saveStoredData(controlData);

        let guidanceText = "";
        switch(selectedValue) {
            case "💤 Low Energy":
                guidanceText = "✨ Low energy day. Focus on just 1 non-negotiable task.";
                break;
            case "💡 Manageable":
                guidanceText = "✨ Steady focus. You have room for 2 core tasks today.";
                break;
            case "⚡️ High Energy":
                guidanceText = "✨ High energy! Perfect capacity for your Top 3 priorities.";
                break;
            case "🔋 Unstoppable":
                guidanceText = "✨ Unstoppable mood! Tackle your Top 3 + 1 bonus stretch goal.";
                break;
            default:
                guidanceText = "✨ Select your current energy level to calculate capacity.";
        }

        guidanceDisplay.innerText = guidanceText;
    }

    function logStreakDay() {
        const todayStr = getFormattedToday();

        if (controlData.lastLoggedDate === todayStr) {
            showToast("Already logged for today!");
            return;
        }

        controlData.streak += 1;
        controlData.lastLoggedDate = todayStr;
        saveStoredData(controlData);

        updateStreakUI();
        showToast("Day logged! Keep building.");
        
        const resetBtn = document.getElementById('resetBtn');
        if (isConfirmingReset) {
            isConfirmingReset = false;
            resetBtn.classList.remove('confirm-state');
            resetBtn.innerText = '🔄';
        }
    }

    function handleResetClick() {
        const resetBtn = document.getElementById('resetBtn');

        if (!isConfirmingReset) {
            isConfirmingReset = true;
            resetBtn.classList.add('confirm-state');
            resetBtn.innerText = 'Confirm Reset?';
            
            setTimeout(() => {
                if (isConfirmingReset) {
                    isConfirmingReset = false;
                    resetBtn.classList.remove('confirm-state');
                    resetBtn.innerText = '🔄';
                }
            }, 3000);
        } else {
            controlData.streak = 0;
            controlData.lastLoggedDate = "";
            saveStoredData(controlData);

            updateStreakUI();
            isConfirmingReset = false;
            resetBtn.classList.remove('confirm-state');
            resetBtn.innerText = '🔄';
            showToast("Counter reset to 0.");
        }
    }

    function updateStreakUI() {
        const numDisplay = document.getElementById('streakNumberDisplay');
        const textDisplay = document.getElementById('streakTextDisplay');
        
        numDisplay.innerText = controlData.streak;
        
        if (controlData.streak === 1) {
            textDisplay.innerText = "1 day completed! Great start.";
        } else {
            textDisplay.innerText = `${controlData.streak} days in a row! Keep going.`;
        }
    }

    function showToast(message) {
        let toast = document.getElementById('widgetToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'widgetToast';
            toast.style.cssText = `
                position: absolute;
                bottom: 8px;
                left: 50%;
                transform: translateX(-50%);
                background: #2C2526;
                color: #ffffff;
                padding: 4px 12px;
                border-radius: 12px;
                font-size: 0.72rem;
                opacity: 0;
                transition: opacity 0.25s ease;
                pointer-events: none;
                white-space: nowrap;
                box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            `;
            document.querySelector('.widget-container').appendChild(toast);
        }

        toast.innerText = message;
        toast.style.opacity = '1';

        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2000);
    }

    window.addEventListener('DOMContentLoaded', () => {
        setLiveWidgetDate();
        if (controlData.energyLevel) {
            document.getElementById('energySelect').value = controlData.energyLevel;
        }
        runEnergyFormula();
        updateStreakUI();
    });
</script>
