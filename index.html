<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Control Center 🌸</title>
    <style>
        :root {
            --text-dark: #2C2526;
            --text-muted: #746264;
            --accent-green: #e1efe3;
            --text-green: #386b42;
            --accent-pink: #fdebee;
            --text-pink: #9e2a4b;
            --bg-card: #ffffff;
            --border-light: #efeae4;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: normal;
            letter-spacing: 1px;
            color: var(--text-dark);
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .energy-select-wrapper {
            position: relative;
        }

        select {
            font-family: inherit;
            font-size: 0.85rem;
            background-color: #f3f3f3;
            color: var(--text-dark);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            outline: none;
            appearance: none;
            padding-right: 18px;
        }

        .energy-select-wrapper::after {
            content: "▾";
            position: absolute;
            right: 6px;
            top: 2px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .date-display {
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .quote-block-green {
            background-color: var(--accent-green);
            color: var(--text-green);
            padding: 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .quote-block-pink {
            background-color: var(--accent-pink);
            color: var(--text-pink);
            padding: 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        /* Fixed wide-align layout matrix row at the base */
        .streak-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid #f9f6f2;
            padding-top: 14px;
            width: 100%;
        }

        .streak-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap; /* Prevents text splitting into multiple lines */
        }

        .btn-streak-increment {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            color: var(--text-dark);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 4px 10px;
            white-space: nowrap; /* Keeps button text on one unified block */
            background-color: #ffffff;
        }
        .btn-streak-increment:hover { background: #fafafa; border-color: var(--text-muted); }
    </style>
</head>
<body>

<div class="widget-container">
    <h1 class="header-title">🌸 DAILY CONTROL CENTER</h1>

    <div class="meta-status-row">
        <div class="energy-select-wrapper">
            <select id="energySelect" onchange="saveEnergyLevel()">
                <option value="💡 Manageable">☀️ Manageable</option>
                <option value="⚡️ High Energy">⚡️ High Energy</option>
                <option value="🔋 Unstoppable">🔋 Unstoppable</option>
                <option value="💤 Low Energy">💤 Low Energy</option>
            </select>
        </div>
        <div class="date-display" id="currentDateDisplay">September 2, 2026</div>
    </div>

    <div class="quote-block-green" id="mainMotivationalQuote">
        👁 Close your eyes. Focus on making yourself feel excited, powerful. Imagine yourself destroying goals with ease.
    </div>

    <div class="quote-block-pink">
        ✨ You've got room for your Top 3. Let's do this!
    </div>

    <div class="streak-footer-row">
        <div class="streak-info">
            <span id="streakNumberDisplay" style="font-weight: bold; color: var(--text-dark);">0</span> 
            <span>🌱</span> 
            <span id="streakTextDisplay">0 days in a row! Momentum is gathering.</span>
        </div>
        <button class="btn-streak-increment" onclick="logStreakDay()">+ log day</button>
    </div>
</div>

<script>
    const tateQuotes = [
        "👁 Focus on making yourself feel excited, powerful. Imagine yourself destroying goals with ease.",
        "👁 Success is not accidental. It is a reward for showing up every single day when everyone else quit.",
        "👁 High absolute discipline beats temporary fleeting motivation every single time. Build your mind.",
        "👁 Cost of regret is far heavier than the price of daily hard work. Get up and execute your plan.",
        "👁 True power is controlling your focus when distractions are begging for your attention.",
        "👁 Close your eyes and realize nobody is coming to save you. You must build your own empire.",
        "👁 Real routine momentum gathers when you stop negotiating with your own lazy thoughts."
    ];

    let controlData = JSON.parse(localStorage.getItem('notion_control_center_fixed')) || {
        energy: "💡 Manageable",
        streak: 0
    };

    function setLiveWidgetDate() {
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDateDisplay').innerText = today.toLocaleDateString('en-US', options);
        
        const quoteIndex = today.getDate() % tateQuotes.length;
        document.getElementById('mainMotivationalQuote').innerText = tateQuotes[quoteIndex];
    }

    function renderControlState() {
        localStorage.setItem('notion_control_center_fixed', JSON.stringify(controlData));
        
        document.getElementById('energySelect').value = controlData.energy;
        document.getElementById('streakNumberDisplay').innerText = controlData.streak;
        document.getElementById('streakTextDisplay').innerText = `${controlData.streak} days in a row! Momentum is gathering.`;
    }

    function saveEnergyLevel() {
        controlData.energy = document.getElementById('energySelect').value;
        renderControlState();
    }

    function logStreakDay() {
        controlData.streak++;
        renderControlState();
    }

    window.addEventListener('dblclick', function(e) {
        if(e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') {
            if(confirm("Reset streak counter stats back to 0?")) {
                controlData.streak = 0;
                renderControlState();
            }
        }
    });

    setLiveWidgetDate();
    renderControlState();
</script>

</body>
</html>
